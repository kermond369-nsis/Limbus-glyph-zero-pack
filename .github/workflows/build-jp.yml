name: Build jp.zip (auto-sync)

# 自动同步：定时检查零协最新文本包；发现新版本（或本地表/脚本有改动）即自动构建并发布。
# 手动触发可强制重建、指定源、或仅出 artifact 不发 Release。

on:
  schedule:
    # UTC 13:23 = 北京 21:23，每天错峰检查一次
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: "可选：指定零协包 HTTPS 直链（留空 = 自动取官方最新）"
        required: false
        default: ""
        type: string
      force_rebuild:
        description: "强制重建（忽略版本 / 表未变化的检查）"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "发布 GitHub Release（手动触发时）"
        required: false
        default: true
        type: boolean

concurrency:
  group: auto-build-jp
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      zero_tag: ${{ steps.rel.outputs.zero_tag }}
      zero_url: ${{ steps.rel.outputs.zero_url }}
      map_version: ${{ steps.check.outputs.map_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve 零协 latest package
        id: rel
        env:
          INPUT_URL: ${{ inputs.source_url || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_URL:-}" ]; then
            echo "url=${INPUT_URL}" >> "$GITHUB_OUTPUT"
            echo "zero_url=${INPUT_URL}" >> "$GITHUB_OUTPUT"
            echo "zero_tag=manual-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
            echo "Using provided URL: ${INPUT_URL}"
            exit 0
          fi
          # 取最近 10 个 release，找第一个含 LimbusLocalize*.7z/.zip 资产的（优先 7z）
          api=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: limbuskj-glyph-pack" \
            "https://api.github.com/repos/LocalizeLimbusCompany/LocalizeLimbusCompany/releases?per_page=10")
          resolved=$(echo "$api" | python3 -c "
          import sys, json
          rels = json.load(sys.stdin)
          tag = url = None
          for r in rels:
              assets = r.get('assets') or []
              for a in assets:
                  n = a.get('name','')
                  if n.startswith('LimbusLocalize') and n.endswith('.7z'):
                      tag, url = r['tag_name'], a['browser_download_url']; break
              if not url:
                  for a in assets:
                      n = a.get('name','')
                      if n.startswith('LimbusLocalize') and n.endswith('.zip'):
                          tag, url = r['tag_name'], a['browser_download_url']; break
              if url: break
          if not url:
              sys.exit('no LimbusLocalize .7z/.zip asset found in recent releases')
          print(tag); print(url)
          ")
          tag=$(echo "$resolved" | sed -n 1p)
          url=$(echo "$resolved" | sed -n 2p)
          echo "Zero-assoc latest: tag=$tag"
          echo "zero_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zero_url=$url" >> "$GITHUB_OUTPUT"

      - name: Check build state (zero tag + local assets hash)
        id: check
        run: |
          set -euo pipefail
          assets_hash=$(cat assets/glyph_map.json assets/safe_charset.txt scripts/pack_zero_to_jp.py | sha256sum | cut -d' ' -f1)
          cur="${{ steps.rel.outputs.zero_tag }}:${assets_hash}"
          last=$(cat .build-state 2>/dev/null || echo "none")
          mapver=$(python3 -c "import json;print(json.load(open('assets/glyph_map.json'))['version'])")
          echo "map_version=$mapver" >> "$GITHUB_OUTPUT"
          echo "current state : $cur"
          echo "last state    : $last"
          if [ "${{ inputs.force_rebuild || 'false' }}" = "true" ] || [ "$cur" != "$last" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "=> will build"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "=> up to date, skip build"
          fi

  pack:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download 零协 package
        env:
          URL: ${{ needs.check.outputs.zero_url }}
        run: |
          set -euo pipefail
          echo "Downloading: $URL"
          curl -fsSL \
            -H "User-Agent: limbuskj-glyph-pack" \
            -H "Accept: application/octet-stream" \
            -L -o source.pack "$URL"
          ls -lh source.pack
          file source.pack || true
          if file source.pack | grep -qi 'HTML'; then
            echo "Got HTML instead of archive — abort" >&2
            head -c 400 source.pack >&2 || true
            exit 1
          fi

      - name: Detect archive type and extract
        run: |
          set -euo pipefail
          T=$(file -b source.pack || true)
          echo "file=$T"
          mkdir -p source_in
          if echo "$T" | grep -qi '7-zip\|RAR\|archive'; then
            7z x -y -osource_in source.pack
          elif echo "$T" | grep -qi 'Zip'; then
            unzip -q source.pack -d source_in
          else
            if ! 7z x -y -osource_in source.pack; then
              unzip -q source.pack -d source_in
            fi
          fi
          find source_in -maxdepth 5 -type d | head -30

      - name: Audit glyph map against corpus (dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZTAG: ${{ needs.check.outputs.zero_tag }}
          MAPVER: ${{ needs.check.outputs.map_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! python3 scripts/audit_glyph_map.py --corpus source_in > audit_output.txt 2>&1; then
            cat audit_output.txt
            {
              echo "## ❌ 字形闭环审计失败"
              echo ""
              echo "- 零协源：\`${ZTAG}\`"
              echo "- 表版本：\`${MAPVER}\`"
              echo ""
              echo '```text'
              cat audit_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            curl -fsSL -L -o ghcruise_ref.zip \
              "https://github.com/ghcruise/LimbusCompany-IOS-Localization/releases/latest/download/localize_jp.zip" || true
            if [ -s ghcruise_ref.zip ] && file ghcruise_ref.zip | grep -qi 'Zip'; then
              python3 scripts/diff_from_reference.py \
                --llc source_in \
                --ref ghcruise_ref.zip > diff_suggest.txt 2>&1 || true
            fi

            python3 - <<'PY' > alert_issue.md
          import os
          from pathlib import Path

          ztag = os.environ["ZTAG"]
          mapver = os.environ["MAPVER"]
          run_url = os.environ["RUN_URL"]
          audit_txt = Path("audit_output.txt").read_text(encoding="utf-8", errors="replace").strip()
          diff_p = Path("diff_suggest.txt")
          diff_txt = diff_p.read_text(encoding="utf-8", errors="replace").strip() if diff_p.exists() else ""

          print(f"自动同步流水线检测到零协新版本 **`{ztag}`** 存在未覆盖的字形或字符，闭环校验失败并已中止构建。")
          print()
          print(f"- **零协版本**：`{ztag}`")
          print(f"- **当前字形表**：`{mapver}`")
          print(f"- **构建日志**：{run_url}")
          print()
          print("### 审计输出（越界字符统计）")
          print("```text")
          print(audit_txt[:6000])
          print("```")
          if diff_txt:
              print()
              print("### 自动差分建议（对照 `ghcruise` 最新 Release）")
              print("```text")
              print(diff_txt[:6000])
              print("```")
          print()
          print("### 本地快速修复命令")
          print("```bash")
          print("python3 scripts/diff_from_reference.py --llc LimbusLocalize.zip --ref localize_jp.zip --apply --new-version YYYY-MM-DD.fullN")
          print("python3 scripts/audit_glyph_map.py --corpus LimbusLocalize.zip")
          print("```")
          PY

            gh label create glyph-sync-alert \
              --repo "$GITHUB_REPOSITORY" \
              --color D93F0B \
              --description "Automated glyph closure check alert" \
              --force || true

            ISSUE_NUM=$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --label glyph-sync-alert \
              --state open \
              --json number \
              --jq '.[0].number // empty' || true)

            if [ -n "${ISSUE_NUM:-}" ]; then
              gh issue edit "$ISSUE_NUM" \
                --repo "$GITHUB_REPOSITORY" \
                --title "[auto-sync] 字形闭环校验失败：零协 ${ZTAG}" \
                --body-file alert_issue.md || true
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --label glyph-sync-alert \
                --title "[auto-sync] 字形闭环校验失败：零协 ${ZTAG}" \
                --body-file alert_issue.md || true
            fi
            exit 1
          fi
          cat audit_output.txt

      - name: Pack jp.zip (closure check is fail-fast)
        run: |
          python3 scripts/pack_zero_to_jp.py \
            --input source_in \
            --output jp.zip \
            --glyph-map assets/glyph_map.json \
            --safe-charset assets/safe_charset.txt

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('jp.zip.report.json'))
          sha = open('jp.zip.sha256').read().split()[0]
          print("## jp.zip 构建报告")
          print()
          print("| 项 | 值 |")
          print("|---|---|")
          print("| 零协源 | ${{ needs.check.outputs.zero_tag }} |")
          print("| 表版本 | ${{ needs.check.outputs.map_version }} |")
          print(f"| 文件数 | {r['files']} |")
          print(f"| 条目 | single={r['entries']['single']} / phrase={r['entries']['phrase']} |")
          print(f"| 单字命中 | {r['single_hits_total']} |")
          print(f"| 词组命中 | {r['phrase_hits']} |")
          print(f"| 闭环校验 | {'PASS' if not r['outside_safe_charset'] else 'FAIL'} |")
          print(f"| sha256 | `{sha}` |")
          PY

      - name: Update build state
        run: |
          set -euo pipefail
          assets_hash=$(cat assets/glyph_map.json assets/safe_charset.txt scripts/pack_zero_to_jp.py | sha256sum | cut -d' ' -f1)
          echo "${{ needs.check.outputs.zero_tag }}:${assets_hash}" > .build-state
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .build-state
          if git diff --staged --quiet; then
            echo "build state unchanged (content identical)"
          else
            git commit -m "chore: build state -> 零协 ${{ needs.check.outputs.zero_tag }} (map ${{ needs.check.outputs.map_version }})"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
            echo "build state updated & pushed"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jp.zip
          path: |
            jp.zip
            jp.zip.sha256
            jp.zip.report.json
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZTAG: ${{ needs.check.outputs.zero_tag }}
          MAPVER: ${{ needs.check.outputs.map_version }}
        run: |
          set -euo pipefail
          TAG="jp-${ZTAG}"
          python3 - <<'PY' > release_notes.md
          import os, textwrap
          from datetime import datetime, timezone

          ztag = os.environ["ZTAG"]
          mapver = os.environ["MAPVER"]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          print(textwrap.dedent(f"""\
          自动构建：零协源 `{ztag}` · 表版本 `{mapver}` · 构建时间 {now}

          ### 产物说明
          - `jp.zip`：安卓全树包（`Android/data/com.ProjectMoon.LimbusCompany/files/Assets/Resources_moved/Localize/jp/**`），解压合并至内部存储根目录即可
          - `jp.zip.sha256`：SHA-256 完整性校验文件
          - `jp.zip.report.json`：替换命中统计与 `safe_charset` 闭环校验报告

          ### 上游归属、修改声明与许可
          - **上游译文**：[LocalizeLimbusCompany（都市零协会）](https://github.com/LocalizeLimbusCompany/LocalizeLimbusCompany)（[官网](https://www.zeroasso.top)），遵循 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 协议（**禁止商用，二次分发须保留署名并采用相同协议**）
          - **字形行为参照**：[ghcruise/LimbusCompany-IOS-Localization](https://github.com/ghcruise/LimbusCompany-IOS-Localization)、[pzwboy/LocalizeLimbusCompanyForAndroid](https://github.com/pzwboy/LocalizeLimbusCompanyForAndroid)
          - **修改声明**：基于零协 `LLC_zh-CN` 原文执行自动化日语字形替换与 `JP_` 安卓目录重打包，未更改译文原意
          - **完整声明与源码协议**：仓库脚本与映射表遵循 MIT 协议，详见 [THIRD_PARTY_NOTICES.md](https://github.com/kermond369-nsis/Limbus-glyph-zero-pack/blob/main/THIRD_PARTY_NOTICES.md)"""))
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber jp.zip jp.zip.sha256 jp.zip.report.json
            gh release edit "$TAG" --notes-file release_notes.md
            echo "release $TAG updated (clobber)"
          else
            gh release create "$TAG" --title "jp.zip · 零协 $ZTAG" --notes-file release_notes.md \
              jp.zip jp.zip.sha256 jp.zip.report.json
            echo "release $TAG created"
          fi

      - name: Close resolved glyph-sync alert issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZTAG: ${{ needs.check.outputs.zero_tag }}
          MAPVER: ${{ needs.check.outputs.map_version }}
        run: |
          set -euo pipefail
          OPEN_ISSUES=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label glyph-sync-alert \
            --state open \
            --json number \
            --jq '.[].number' || true)
          for num in $OPEN_ISSUES; do
            [ -n "$num" ] || continue
            gh issue close "$num" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "已由零协 \`${ZTAG}\`（表版本 \`${MAPVER}\`）构建通过并恢复正常，自动关闭此告警。" || true
          done
