name: Build jp.zip

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of 零协 LimbusLocalize archive (.7z/.zip). You must host it; captcha sources are not supported."
        required: true
        type: string
      publish_release:
        description: "Also create a GitHub Release with the artifact"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Release tag if publishing (e.g. 2026-09-12)"
        required: false
        default: ""
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Determine source URL
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.source_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.release.assets[0].browser_download_url }}" >> "$GITHUB_OUTPUT"
            echo "fallback from release assets" 
          fi

      - name: Download source
        run: |
          set -euo pipefail
          URL="${{ steps.src.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "No source_url provided" >&2
            exit 1
          fi
          echo "Downloading: $URL"
          curl -fsSL -A "Mozilla/5.0" -o source.pack "$URL"
          ls -lh source.pack
          file source.pack || true

      - name: Detect archive type
        id: type
        run: |
          T=$(file -b source.pack || true)
          echo "file=$T"
          if echo "$T" | grep -qi '7-zip\|RAR'; then
            7z x -y -osrc_ extracted source.pack
            mv src_ extracted source_in
          elif echo "$T" | grep -qi 'Zip'; then
            mkdir -p source_in
            unzip -q source.pack -d source_in
          else
            # try 7z then zip
            mkdir -p source_in
            if 7z x -y -osource_in source.pack; then
              echo extracted with 7z
            else
              unzip -q source.pack -d source_in
            fi
          fi
          find source_in -maxdepth 3 -type d | head -20

      - name: Pack jp.zip
        run: |
          python3 scripts/pack_zero_to_jp.py \
            --input source_in \
            --output jp.zip \
            --glyph-map assets/glyph_map.json \
            --font-ok assets/font_ok.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp.zip
          path: |
            jp.zip
            jp.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: jp.zip build
          files: |
            jp.zip
            jp.zip.sha256
          body: |
            Generated by limbus-glyph-pack CI from a user-provided 零协 archive.
            Glyph map: assets/glyph_map.json
            Content license remains CC BY-NC-SA 4.0 (零协).
