name: Build jp.zip

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of 零协 archive (.7z/.zip). Leave empty to use LocalizeLimbusCompany latest GitHub Release asset."
        required: false
        default: ""
        type: string
      publish_release:
        description: "Also create a GitHub Release with the artifact"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Release tag if publishing (e.g. 2026-09-12)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Resolve source URL
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_URL:-}" ]; then
            echo "url=${INPUT_URL}" >> "$GITHUB_OUTPUT"
            echo "Using provided URL"
            exit 0
          fi
          # Official 零协 GitHub Release asset (no captcha on api.github.com / release download)
          api=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: limbus-glyph-zero-pack" \
            https://api.github.com/repos/LocalizeLimbusCompany/LocalizeLimbusCompany/releases/latest)
          echo "$api" | python3 -c "import sys,json; d=json.load(sys.stdin); print('tag', d.get('tag_name')); [print('asset', a['name'], a['size']) for a in d.get('assets') or []]"
          url=$(echo "$api" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assets = d.get('assets') or []
          # Prefer LimbusLocalize_*.7z / .zip (not source code, not font)
          pick = None
          for a in assets:
              n = a.get('name','')
              if n.startswith('LimbusLocalize') and n.endswith(('.7z','.zip')):
                  pick = a['browser_download_url']
                  break
          if not pick:
              for a in assets:
                  n = a.get('name','')
                  if n.endswith(('.7z','.zip')) and 'Font' not in n and not n.endswith('.tar.gz'):
                      pick = a['browser_download_url']
                      break
          if not pick:
              sys.exit('No LimbusLocalize .7z/.zip asset in latest release')
          print(pick)
          ")
          echo "Using official release asset: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download source
        env:
          URL: ${{ steps.src.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Downloading: $URL"
          # Auth headers help private assets; harmless for public zero-assoc
          curl -fsSL \
            -H "User-Agent: limbus-glyph-zero-pack" \
            -H "Accept: application/octet-stream" \
            -L -o source.pack "$URL"
          ls -lh source.pack
          file source.pack || true
          # If HTML/login page, fail clearly
          if file source.pack | grep -qi 'HTML'; then
            echo "Got HTML instead of archive — check URL or captcha/proxy" >&2
            head -c 400 source.pack >&2 || true
            exit 1
          fi

      - name: Detect archive type and extract
        run: |
          set -euo pipefail
          T=$(file -b source.pack || true)
          echo "file=$T"
          mkdir -p source_in
          if echo "$T" | grep -qi '7-zip\|RAR\|archive'; then
            7z x -y -osource_in source.pack
          elif echo "$T" | grep -qi 'Zip'; then
            unzip -q source.pack -d source_in
          else
            if ! 7z x -y -osource_in source.pack; then
              unzip -q source.pack -d source_in
            fi
          fi
          find source_in -maxdepth 5 -type d | head -40
          find source_in -name 'AbDlg_Faust.json' -o -name 'AbDlg_*.json' | head -10

      - name: Pack jp.zip
        run: |
          python3 scripts/pack_zero_to_jp.py \
            --input source_in \
            --output jp.zip \
            --glyph-map assets/glyph_map.json \
            --font-ok assets/font_ok.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp.zip
          path: |
            jp.zip
            jp.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: jp.zip build
          files: |
            jp.zip
            jp.zip.sha256
          body: |
            Generated from 零协 (LocalizeLimbusCompany) release asset + local glyph map.
            Content license remains CC BY-NC-SA 4.0.
